# ==============================================================================
# CityJSON LOD Generation — Default Configuration
# ==============================================================================
# Override any parameter from the CLI using dot notation:
#   python src/main.py model.hidden_dim=128 training.batch_size=16 mode=inference
# ==============================================================================

# --- Run Mode ---------------------------------------------------------------
# "train" or "inference"
mode: train

# --- Seed -------------------------------------------------------------------
seed: 42

# --- Data -------------------------------------------------------------------
data:
  dataset_dir: data/The Hague
  lods: 1
  normalize_coords: false
  n_max: null              # null = auto-detect from dataset
  num_workers: 0
  upper_limit_nodes: null  # null = no limit
  # Metres per unit of the model's coordinate space; targets are divided by it so
  # the data matches the unit-variance prior the position diffusion noises toward.
  # null = pooled std of the train split (~4.3 m on The Hague LOD2).
  coord_scale: null

# --- Model ------------------------------------------------------------------
model:
  num_node_classes: 5  # vertex, ground, roof, wall, off (Levi graph)
  num_edge_classes: 3  # off, vertex-vertex, vertex-face
  equivariance: so2    # so2 | se2 (xy-only CoM, absolute z) | o3
  hidden_dim: 64                 # dx, must be divisible by n_head
  edge_dim: 32                   # de, drives [B,N,N,de] memory — keep small
  global_dim: 32                 # dy
  n_head: 8
  num_layers: 4
  dropout: 0.1
  T: 500
  discrete_noise_type: marginal  # marginal | uniform

  # Cosine schedule exponent per feature; nu_pos > nu_e noises coords faster.
  nu_pos: 2.5
  nu_x: 1.0
  nu_e: 1.5

  # Loss weights (MiDi lambda_train, restricted to pos / X / E).
  lambda_pos: 3.0
  lambda_x: 0.4
  lambda_e: 2.0

# --- Training ---------------------------------------------------------------
training:
  lr: 1.0e-3
  batch_size: 32
  max_epochs: 200
  train_val_test_split: [0.8, 0.1, 0.1]
  gradient_clip_val: 1.0

  # Early stopping
  early_stopping:
    enabled: true
    monitor: val_coord_mse
    patience: 20
    mode: min

  # Model checkpointing
  checkpoint:
    enabled: true
    monitor: val_coord_mse
    mode: min
    save_top_k: 3
    filename: "epoch={epoch:03d}-val_mse={val_coord_mse:.4f}"

# --- Inference --------------------------------------------------------------
inference:
  checkpoint_path: null    # path to .ckpt file (required for inference mode)
  batch_size: 4            # number of buildings to generate
  output_dir: outputs/generated

# --- WandB Logging ----------------------------------------------------------
wandb:
  enabled: true
  project: lod-generation
  entity: null             # null = use default wandb entity
  name: null               # null = auto-generated run name
  tags: []
  log_model: false         # upload checkpoints to wandb

# --- Trainer ----------------------------------------------------------------
trainer:
  accelerator: auto        # auto | cpu | gpu | mps
  devices: 1
  precision: 32            # 32 | 16-mixed | bf16-mixed
  log_every_n_steps: 10
