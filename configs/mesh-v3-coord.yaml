# V2 baseline, re-run after the tokenization fixes
# Usage: python main.py --train --config configs/mesh-v3-coord.yaml
#
# One of four runs, now aligned with mesh-v4-scratch-sin: sinusoidal positions,
# flat lr 5e-5 with no schedule, early stopping and checkpointing on
# val_token_acc/max, and beam search at eval. Dataset, `max_faces`, effective
# batch, schedule and seed are identical across all four -- and, since
# sinusoidal positions removed OPT's 2048-position ceiling, the max_faces
# asymmetry that used to make scratch-vs-OPT a dirty comparison is gone too.
# Only tokenization and backbone vary. Launch them with:
#   ./run_experiments.sh --smoke      (verify configs in minutes)
#   nohup ./run_experiments.sh > experiments.out 2>&1 &
#
# These supersede the first v3 arms (wandb `mesh-v3-*`, no suffix); the runs
# here log as `mesh-v3-*-sin` and their numbers are not comparable with those.
#
# The reference point. Same design as mesh-v2-2 -- coordinate tokens, no
# VQ-VAE, from-scratch backbone -- but on `mini_cleaner` and after three
# tokenizer corrections: whole-surface triangulation (courtyards no longer
# paved over), correct concave triangulation, and degenerate faces dropped.
# Its numbers are therefore NOT comparable with mesh-v2/mesh-v2-2.

mode: train
config_set: mesh
seed: 42

# Not read under config_set: mesh, but DataConfig.dataset_dir is MISSING and
# OmegaConf resolves the whole schema, so it still needs a value.
data:
  dataset_dir: data/The Hague/mini_cleaner

mesh_data:
  dataset_dir: data/The Hague/mini_cleaner
  # Real LOD1, not LOD1_synth: `cleaner` is built on the real pair and is
  # Source B only, since Source A ships no lod-1 geometry.
  lod_in: LOD1
  lod_out: LOD2
  num_bins: 128
  margin_lo: [0.0, 0.0, 0.0]
  margin_hi: [0.0, 0.0, 0.1]
  # A *triangle* cap, applied to both LOD1 and LOD2 -- not a surface cap.
  # 200 on all four arms now. It used to be 113 here on OPT, because a learned
  # position table shares one budget of 2048 across cond + target; sinusoidal
  # positions have no table, so that constraint is gone and with it the reason
  # for the asymmetry. Purely a corpus filter now, not a capacity decision.
  #
  # Measured on mini_cleaner: 200 keeps 97.8% of pairs, 113 kept 89.3%.
  max_faces: 200
  max_files: null
  tokenization: coord
  num_workers: 10
  persistent_workers: false

mesh_model:
  backbone: scratch
  d_model: 512
  n_head: 8
  num_layers: 6
  dropout: 0.1
  # Fixed Fourier positions (Vaswani et al., arXiv:1706.03762 section 3.5).
  # No parameters and no row count, so the length ceiling disappears rather
  # than moving. The failure mode changes with it: too long no longer raises,
  # it degrades, because absolute sinusoidal positions do not reliably
  # extrapolate past the lengths actually trained on (Press et al.,
  # arXiv:2108.12409).
  pos_embed: sinusoidal
  # Unset, so capacity falls back to the corpus's longest segment. Under
  # sinusoidal positions that is no longer a ceiling -- it survives only as the
  # generation budget, the cap for when EOS never arrives.
  n_max_triangles: null
  cond_max_triangles: null
  max_seq_len: null
  tokenizer: coord          # no VQ-VAE on any of these
  vqvae_ckpt: null
  # Sampling-time only; never touches training, so it cannot confound the A/B.
  mask_invalid: true

training:
  batch_size: 4
  accumulate_grad_batches: 4   # effective batch 16 on every run,
                               # at a quarter of the peak activation memory
  train_val_test_split: [0.8, 0.1, 0.1]
  # 5e-5 flat, matching mesh-v4-scratch-sin. 20x below the 1e-3 the scratch
  # arms used to run at, so many more epochs are expected; max_epochs is raised
  # to match. With no schedule there is no annealing phase either -- which the
  # earlier v3 arms never reached anyway, early-stopping at 89% of peak LR.
  lr: 5e-5
  max_epochs: 400
  gradient_clip_val: 1.0
  lr_scheduler: "none"
  lr_decay_steps: 50
  lr_decay_rate: 0.5
  # val_token_acc/max. Read the mode twice: mesh-6 monitored this same metric
  # with mode: min, which rewards accuracy *falling*, so it never fired and
  # burned 72 h on a diverging run. `max` is the fix, not a preference.
  #
  # Chosen over val_loss because the two diverge here: on the first mesh-v3-coord
  # run val_loss bottomed at epoch 26 and rose to 1.18 by epoch 40 while
  # val_token_acc kept climbing to 0.749. Selecting on loss stops while the
  # thing we care about is still improving.
  early_stopping:
    enabled: true
    monitor: val_token_acc
    patience: 15
    mode: max
  # Matched to early stopping on purpose. Left on val_loss/min it would save the
  # epoch-26 checkpoint of a run that early-stopped at epoch 45 -- "best" by a
  # criterion the run was not using.
  checkpoint:
    enabled: true
    monitor: val_token_acc
    mode: max
    save_top_k: 3
    filename: "{epoch:02d}-{val_token_acc:.4f}"

trainer:
  accelerator: auto
  devices: 1
  # 32 on every run: switching precision for the OPT arms alone would confound
  # the backbone comparison. bf16-mixed is the first lever if one OOMs.
  precision: "32"
  log_every_n_steps: 50

logging:
  loggers:
    - wandb
  project_name: lod-generation
  experiment_name: initial-runs
  run_name: mesh-v3-coord-sin
  save_dir: outputs
  wandb_entity: maxim-lod
  wandb_offline: false
  log_model: false

mesh_eval:
  enabled: true
  every_n_epochs: 10
  n_val: 8
  n_test: 32
  batch_size: 8
  n_points: 4096
  taus: [0.25, 0.5]
  voxel_m: 0.25
  save_samples: 8
  # Search for the best sequence rather than the best next token. 5x the
  # generation compute, but the KV cache measured 20.6x at 1800 tokens, so the
  # eval is still ~4x cheaper than the greedy runs before it.
  beam_size: 5
  # Not cosmetic: raw sum-of-log-probs prefers short sequences, and short here
  # means a mesh with fewer triangles. 1.0 normalises per token.
  length_penalty: 1.0

resume_from: null
