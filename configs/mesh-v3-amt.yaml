# V2 baseline + Adjacent Mesh Tokenization
# Usage: python main.py --train --config configs/mesh-v3-amt.yaml
#
# One of four runs. Dataset, effective batch, schedule and seed are identical
# across all four; `max_faces` is 200 on the scratch arms and 113 on the OPT
# ones, because only OPT has a shared 2048-position budget. So coord-vs-AMT is
# a clean A/B *within* each backbone pair, while scratch-vs-OPT also differs in
# how much of the corpus it sees (97.8% vs 89.3%). Launch them with:
#   ./run_experiments.sh --smoke      (verify configs in minutes)
#   nohup ./run_experiments.sh > experiments.out 2>&1 &
#
# The AMT arm (MeshAnything V2, arXiv:2408.02555). Measured on mini_cleaner
# AMT is 0.533x the coordinate tokenizer's length, against ~0.49x reported on
# Objaverse -- LOD2 roofs are less well connected than artist meshes.
#
# This is the first run where AMT is worth judging: the role embeddings V2
# specifies (`OPTLoopEmbedding`, a 10-row table splitting face-start from
# adjacent and each by x/y/z) were missing until now, so earlier AMT attempts
# ran without the structural signal the paper says makes it learnable.

mode: train
config_set: mesh
seed: 42

# Not read under config_set: mesh, but DataConfig.dataset_dir is MISSING and
# OmegaConf resolves the whole schema, so it still needs a value.
data:
  dataset_dir: data/The Hague/mini_cleaner

mesh_data:
  dataset_dir: data/The Hague/mini_cleaner
  # Real LOD1, not LOD1_synth: `cleaner` is built on the real pair and is
  # Source B only, since Source A ships no lod-1 geometry.
  lod_in: LOD1
  lod_out: LOD2
  num_bins: 128
  margin_lo: [0.0, 0.0, 0.0]
  margin_hi: [0.0, 0.0, 0.1]
  # A *triangle* cap, applied to both LOD1 and LOD2 -- not a surface cap.
  # 200 on the scratch arms, 113 on the OPT ones, and that asymmetry is the
  # point: the scratch backbone restarts positions per segment, so it is bounded
  # only by what fits in memory, while OPT shares one 2048-position budget
  # across cond + target and 113 is the largest cap whose worst case (2017
  # tokens) still fits. Capping these arms at 113 too would throw away data for
  # a constraint they do not have.
  #
  # Measured on mini_cleaner: 200 keeps 97.8% of pairs, 113 keeps 89.3%.
  max_faces: 200
  max_files: null
  tokenization: amt
  num_workers: 10
  persistent_workers: false

mesh_model:
  backbone: scratch
  d_model: 512
  n_head: 8
  num_layers: 6
  dropout: 0.1
  max_seq_len: null
  tokenizer: coord          # no VQ-VAE on any of these
  vqvae_ckpt: null
  # Sampling-time only; never touches training, so it cannot confound the A/B.
  mask_invalid: true

training:
  batch_size: 4
  accumulate_grad_batches: 4   # effective batch 16 on every run,
                               # at a quarter of the peak activation memory
  train_val_test_split: [0.8, 0.1, 0.1]
  lr: 1e-3
  max_epochs: 200
  gradient_clip_val: 1.0
  lr_scheduler: "cosine"
  lr_decay_steps: 50
  lr_decay_rate: 0.5
  # val_loss/min, NOT val_token_acc. mesh-6 monitored val_token_acc with
  # mode: min, which rewards falling accuracy -- it never fired and burned
  # 72 h on a diverging run. The geometric metrics only exist every 10 epochs
  # so they cannot be monitored either.
  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 15
    mode: min
  checkpoint:
    enabled: true
    monitor: val_loss
    mode: min
    save_top_k: 3
    filename: "{epoch:02d}-{val_loss:.4f}"

trainer:
  accelerator: auto
  devices: 1
  # 32 on every run: switching precision for the OPT arms alone would confound
  # the backbone comparison. bf16-mixed is the first lever if one OOMs.
  precision: "32"
  log_every_n_steps: 50

logging:
  loggers:
    - wandb
  project_name: lod-generation
  experiment_name: initial-runs
  run_name: mesh-v3-amt
  save_dir: outputs
  wandb_entity: maxim-lod
  wandb_offline: false
  log_model: false

mesh_eval:
  enabled: true
  every_n_epochs: 10
  n_val: 8
  n_test: 32
  batch_size: 8
  n_points: 4096
  taus: [0.25, 0.5]
  voxel_m: 0.25
  save_samples: 8

resume_from: null
