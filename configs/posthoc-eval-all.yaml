# Post-hoc eval of every current arm in one call: the image-free v5 baseline
# and the three orthophoto-conditioned v6 runs.
#
#   python -m src.eval.posthoc_eval --config configs/posthoc-eval-all.yaml
#
# Guide: docs/posthoc-eval-runbook.md
#
# `checkpoints` pairs with `reference_configs` by position. null picks that run's
# lowest `val_gen_chamfer_m=<x>.ckpt` under <save_dir>/<experiment>/<run>/checkpoints,
# falling back to last.ckpt. Every model is checked before any data loads.
#
# Each model is scored on ITS OWN config's split: v5-tile and the xattn arms use
# the tile split, the prefix-aligned arm the random split, and v6 drops buildings
# without imagery. Rows are comparable within a model, not across models.
#
# A full test split is up to 1801 sequential forward passes per building, ~26k
# buildings, 7 strategies, 4 models: a multi-day GPU job. Calibrate first:
#   python -m src.eval.posthoc_eval --config configs/posthoc-eval-all.yaml max_objects=8

reference_configs:
  - configs/mesh-v5-full-opt-coord-tile.yaml
  - configs/mesh-v6-ortho-prefix-aligned.yaml
  - configs/mesh-v6-ortho-xattn-a.yaml
  - configs/mesh-v6-ortho-xattn-b.yaml
checkpoints: [null, null, null, null]

# Dot-list applied to every reference config, e.g.
#   ["mesh_data.dataset_dir=data/The Hague/mini_remote"]
reference_overrides: []

split: test
max_objects: null     # null = the whole split; seeded subsample otherwise
batch_size: 8
seed: 1234
device: auto
image_mode: "true"    # true | shuffled | none; ignored by the image-free v5
output_dir: null      # -> outputs/posthoc_eval/<stamp>/<run_name>/

strategies:
  - {kind: greedy}
  - {kind: beam,  beam_size: [3, 5], length_penalty: [1.0]}
  - {kind: top_p, top_p: [0.95], temperature: [0.6, 1.2]}
  - {kind: min_p, min_p: [0.05], temperature: [0.6, 1.2]}

# roof_chamfer against lod2 is what ranks the good/avg/bad samples.
metrics: [chamfer, hausdorff, vol_symdiff, sinkhorn, roof_chamfer]
references: [lod1, lod2]
n_points: 4096

# Three n x n log-domain solves per reference per object. Fine on a GPU; drop
# n_points to 1024 when `device: cpu`, where it dominates the metric time.
sinkhorn: {n_points: 2048, blur_m: 0.1, max_iters: 500, tol: 1.0e-6}
