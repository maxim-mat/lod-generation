# Shared settings for every mesh-diff arm. Not runnable alone -- it sets no
# mesh_diffusion axis. Merge an arm config over it:
#   ./run_experiments.sh --diff-stage 1
# which merges this file with each arm file before launching.
#
# Dataset, split, effective batch, schedule and seed are identical across all
# arms and identical to the mesh-v3-*-sin autoregressive arms, so a diffusion
# number and an AR number on the same corpus are directly comparable. That
# comparability is the point of this file existing.
mode: train
config_set: mesh_diffusion
seed: 42

data:
  dataset_dir: data/The Hague/mini_cleaner

mesh_data:
  dataset_dir: data/The Hague/mini_cleaner
  lod_in: LOD1
  lod_out: LOD2
  num_bins: 128
  margin_lo: [0.0, 0.0, 0.0]
  margin_hi: [0.0, 0.0, 0.1]
  # 200, matching every mesh-v3-*-sin arm. Here it is purely a corpus filter:
  # nothing in this branch has a position table, and the batch pads to its own
  # maximum, so max_faces decides only which buildings are in the dataset.
  max_faces: 200
  max_files: null
  num_workers: 10
  persistent_workers: false

mesh_diffusion:
  d_model: 256
  n_head: 8
  num_layers: 8
  dropout: 0.1
  time_dim: 128
  cond_dropout: 0.1
  noise_steps: 1000
  eval_steps: 50
  guidance: 1.0
  presence_weight: 1.0
  match_presence_weight: 1.0
  snap_before_weld: true
  min_face_area: 1.0e-6
  scaffold:
    enabled: false
    voxel: 0.03125
    dilate: 3
    apply_below_t: 0.5
  # Tier 2, the early-stopping monitor: every validation epoch, 8 buildings,
  # 20 reverse steps. Measured at ~10% of a training epoch.
  n_val_gen: 8
  gen_eval_steps: 20
  # Tier 3, the geometric report: gated, 16 buildings, eval_steps (50).
  every_n_epochs: 10
  n_val: 16
  n_test: 64
  eval_batch_size: 8
  n_points: 4096
  taus: [0.25, 0.5]
  voxel_m: 0.25
  save_samples: 8

training:
  # 4 x 4 = effective batch 16, identical to every mesh-v3/v4 AR arm. Matching
  # both numbers, not just the product, so peak activation memory is comparable
  # too -- the one-hot arm (b5) is 1153 input channels wide and is the arm most
  # likely to be the memory ceiling.
  batch_size: 4
  accumulate_grad_batches: 4
  train_val_test_split: [0.8, 0.1, 0.1]
  # 5e-5 flat, matching the AR arms rather than the 1e-4 DDPM default this
  # file first carried. Deliberate: a diffusion number and an AR number are
  # only comparable if the optimisation is, and an unshared learning rate is
  # the kind of difference that quietly explains a result. Many more epochs are
  # expected at this rate, which is what max_epochs: 1000 is for.
  lr: 5.0e-5
  max_epochs: 1000
  gradient_clip_val: 1.0
  # No schedule. With none there is no annealing phase, so a run that early-
  # stops has not been cut short of one.
  lr_scheduler: "none"
  lr_decay_steps: 50
  lr_decay_rate: 0.5
  # val_gen_coord_mse: the coordinate error of a FREE-RUNNING sample, not the
  # single-step loss. The single-step loss is a Monte-Carlo estimate over t,
  # only loosely coupled to sample quality, and in different units per arm --
  # selecting a checkpoint on it selects for one-step denoising rather than for
  # generation. NOT the geometric metrics either: those run only every
  # every_n_epochs, and EarlyStopping(strict=True) raises on a missing metric.
  # mode: min is correct for every arm by construction -- the monitor is an
  # error for the regression arms and for the categorical ones alike.
  early_stopping:
    enabled: true
    monitor: val_gen_coord_mse
    patience: 25
    mode: min
  checkpoint:
    enabled: true
    monitor: val_gen_coord_mse
    mode: min
    save_top_k: 3
    filename: "{epoch:02d}-{val_gen_coord_mse:.5f}"

trainer:
  accelerator: auto
  devices: 1
  precision: "32"
  log_every_n_steps: 50

logging:
  loggers:
    - wandb
  project_name: lod-generation
  experiment_name: initial-runs
  save_dir: outputs
  wandb_entity: maxim-lod
  wandb_offline: false
  log_model: false

resume_from: null
