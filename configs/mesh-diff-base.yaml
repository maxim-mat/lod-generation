# Shared settings for every mesh-diff arm. Not runnable alone -- it sets no
# mesh_diffusion axis. Merge an arm config over it:
#   ./run_experiments.sh --diff-stage 1
# which merges this file with each arm file before launching.
#
# Dataset, split, batch, schedule and seed are identical across all ARMS, which
# is what makes arm-to-arm gaps mean something -- that is the point of this file
# existing. Against the mesh-v3-*-sin AR arms the corpus, split and lr match but
# the EFFECTIVE BATCH no longer does (4 here, 16 there); see the training block.
mode: train
config_set: mesh_diffusion
seed: 42

data:
  dataset_dir: data/The Hague/mini_cleaner

mesh_data:
  dataset_dir: data/The Hague/mini_cleaner
  lod_in: LOD1
  lod_out: LOD2
  num_bins: 128
  margin_lo: [0.0, 0.0, 0.0]
  margin_hi: [0.0, 0.0, 0.1]
  # 200, matching every mesh-v3-*-sin arm. Here it is purely a corpus filter:
  # nothing in this branch has a position table, and the batch pads to its own
  # maximum, so max_faces decides only which buildings are in the dataset.
  max_faces: 200
  max_files: null
  num_workers: 10
  persistent_workers: false

mesh_diffusion:
  d_model: 256
  n_head: 8
  num_layers: 8
  dropout: 0.1
  time_dim: 128
  cond_dropout: 0.1
  noise_steps: 1000
  # Static thresholding on the x0 estimate. Without it an untrained epsilon
  # model makes the DDIM step a pure rescaling that telescopes to x157, so
  # samples leave the box entirely and the tier-2 monitor starts around 24000
  # instead of ~0.36 -- measured. Set to null to ablate; it is sampler-side, so
  # the same checkpoint can be scored both ways.
  x0_clip: 0.5
  eval_steps: 50
  guidance: 1.0
  presence_weight: 1.0
  match_presence_weight: 1.0
  # Slot budget: how many face slots the model gets, independent of how many
  # the building has. The surplus are no-object slots it must mark absent --
  # the only mechanism deciding face count. Must be >= mesh_data.max_faces.
  slot_budget: 200
  snap_before_weld: true
  min_face_area: 1.0e-6
  # Weights used for SAMPLING -- and therefore for the early-stopping monitor
  # and the checkpoint it selects. Standard in diffusion and worth more here
  # than any lr schedule: it averages out late-training gradient noise, which
  # is large because each update sees only batch_size of the noise schedule.
  # Decay ramps in (see `_ramped_ema`); null disables for the ablation.
  ema_decay: 0.999
  # Held off until step 1000, past the 500-step warmup: averaging weights from
  # the ramp would drag the monitor toward the initialisation.
  ema_start_step: 1000
  scaffold:
    enabled: false
    voxel: 0.03125
    dilate: 3
    apply_below_t: 0.5
  # Tier 2, the early-stopping monitor: every validation epoch, 8 buildings,
  # 20 reverse steps. Measured at ~10% of a training epoch.
  n_val_gen: 8
  gen_eval_steps: 20
  # Tier 3, the geometric report: gated, 16 buildings, eval_steps (50).
  every_n_epochs: 10
  n_val: 16
  n_test: 64
  eval_batch_size: 8
  n_points: 4096
  taus: [0.25, 0.5]
  voxel_m: 0.25
  save_samples: 8

training:
  # 32, no accumulation. The AR arms cap at 4 because `coord` tokenization is
  # 9 tokens per face -- 1800 for a 200-face building against 200 slots here --
  # and attention is quadratic, so their activation cost is ~81x ours at the
  # same building. This branch has no such wall: measured, the U-Net is
  # launch-bound and a step costs 75 ms at batch 4 and 78 ms at batch 256, with
  # peak VRAM 508 MiB at 32. Batch 32 is therefore ~7.8x faster per epoch for
  # free, and it also cuts a variance source specific to diffusion -- every
  # sample draws its own t, so batch 4 estimated an expectation over the whole
  # noise schedule from 4 timesteps per update.
  #
  # A DEPARTURE from the AR arms' effective 16, along with the lr below. Stage 4
  # is therefore best-effort-vs-best-effort, not a controlled comparison; say so
  # when reporting it.
  batch_size: 32
  accumulate_grad_batches: 1
  train_val_test_split: [0.8, 0.1, 0.1]
  # 1e-3. Measured on arm a1 at batch 32 over 250 steps on the full corpus:
  # lr 5e-5 dropped the loss 51% (to 0.969) while 1e-3 dropped it 91% (to
  # 0.135), with gen_coord_mse 0.359 against 0.171. Nothing diverged even at
  # 3e-3 -- the zero-init output head starts the model as the identity, so the
  # early steps are forgiving. 5e-5 was simply far too low.
  #
  # Caveat carried deliberately: 250 steps ranks EARLY progress, and early lr
  # rankings routinely fail to predict final quality. "5e-5 is too slow" is
  # solid; "1e-3 beats 3e-4 at convergence" is not established.
  lr: 1.0e-3
  # Linear ramp over the first 500 optimizer steps (~4 epochs at batch 32),
  # then flat. Insurance for the first hundred updates at a 20x higher lr,
  # while Adam's second moment is still cold. Constant-after-warmup rather than
  # cosine: early stopping would truncate an anneal anyway, so a run that stops
  # has not been cut short of one.
  warmup_steps: 500
  max_epochs: 1000
  gradient_clip_val: 1.0
  # No schedule. With none there is no annealing phase, so a run that early-
  # stops has not been cut short of one.
  lr_scheduler: "none"
  lr_decay_steps: 50
  lr_decay_rate: 0.5
  # val_gen_coord_mse: the coordinate error of a FREE-RUNNING sample, not the
  # single-step loss. The single-step loss is a Monte-Carlo estimate over t,
  # only loosely coupled to sample quality, and in different units per arm --
  # selecting a checkpoint on it selects for one-step denoising rather than for
  # generation. NOT the geometric metrics either: those run only every
  # every_n_epochs, and EarlyStopping(strict=True) raises on a missing metric.
  # mode: min is correct for every arm by construction -- the monitor is an
  # error for the regression arms and for the categorical ones alike.
  early_stopping:
    enabled: true
    monitor: val_gen_coord_mse
    patience: 100
    mode: min
  checkpoint:
    enabled: true
    monitor: val_gen_coord_mse
    mode: min
    save_top_k: 3
    filename: "{epoch:02d}-{val_gen_coord_mse:.5f}"

trainer:
  accelerator: auto
  devices: 1
  precision: "32"
  log_every_n_steps: 50

logging:
  loggers:
    - wandb
  project_name: lod-generation
  experiment_name: initial-runs
  save_dir: outputs
  wandb_entity: maxim-lod
  wandb_offline: false
  log_model: false

resume_from: null
