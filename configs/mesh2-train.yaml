# LOD1-conditioned autoregressive mesh transformer (MeshAnything, arXiv:2406.10163)
# Usage: python main.py --train --config configs/mesh2-train.yaml
#
# Capacity probe against mesh-1. mesh-1 converged (val_loss 0.397 -> 0.389 over
# epochs 26-42, early stopping at 46) with the copyable half of the task solved
# -- footprint IoU 0.979, decode/eos/cityjson rates all 1.0 -- while the geometry
# LOD2 actually adds lagged: bin MAE z 1.33 vs y 0.52 despite z being the primary
# sort key, roof_mean_z_err 0.305 m at coord_mae 0.292 m, merged_face_ratio 0.83.
# Free-running chamfer (0.179 m) beat teacher-forced (0.260 m), so it is not
# exposure bias and not optimization. This run tests whether it is capacity,
# before the far more expensive VQ-VAE rewrite.
#
# Everything below is mesh-train.yaml except mesh_model.d_model and run_name.

mode: train
config_set: mesh
seed: 42

# The diffusion `data:` block is not read under config_set: mesh, but
# DataConfig.dataset_dir is MISSING and OmegaConf resolves the whole schema, so
# it still needs a value. Left deliberately non-real so nothing quietly uses it.
data:
  dataset_dir: data/The Hague/mini

# Mesh dataset settings (MeshDataConfig)
mesh_data:
  dataset_dir: data/The Hague/mini
  lod_in: LOD1_synth
  lod_out: LOD2
  num_bins: 128
  # Headroom below / above the LOD1 box, per axis (x, y, z), as a fraction of
  # its scale. p99 on mini is 0 on every side but +z, which buys room for the
  # ridge above the median roof height. All six are settable; see the load log.
  margin_lo: [0.0, 0.0, 0.0]
  margin_hi: [0.0, 0.0, 0.1]
  max_faces: 200
  max_files: null
  num_workers: 10
  persistent_workers: false

# Transformer settings (MeshModelConfig)
#
# 256 -> 512 only. Block parameters go as num_layers * d_model^2, so doubling
# the width is exactly 4x on them: ~5.3M -> ~20M total. Width rather than depth
# because mesh-1's failure is which coordinate it predicts, not how many
# sequential steps of reasoning it takes to get there. n_head stays 8, giving
# the standard 64-wide head instead of a wider-but-fewer split.
mesh_model:
  d_model: 512
  n_head: 8
  num_layers: 6
  dropout: 0.1
  max_seq_len: null      # null = size it from the dataset's longest pair

training:
  batch_size: 8          # sequences are long; attention is quadratic in length
  train_val_test_split:
    - 0.8
    - 0.1
    - 0.1
  lr: 1e-3
  max_epochs: 100
  gradient_clip_val: 1.0
  lr_scheduler: "cosine"
  lr_decay_steps: 50
  lr_decay_rate: 0.5
  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 10
    mode: min
  checkpoint:
    enabled: true
    monitor: val_loss
    mode: min
    save_top_k: 3
    filename: "{epoch:02d}-{val_loss:.4f}"

trainer:
  accelerator: auto
  devices: 1
  precision: "32"
  log_every_n_steps: 50

logging:
  loggers:
    - wandb
  project_name: lod-generation
  experiment_name: initial-runs
  run_name: mesh-2
  save_dir: outputs
  wandb_entity: maxim-lod
  wandb_offline: false
  log_model: false

# Free-running generation scored against the paired ground-truth LOD2. The
# unconditional generative_eval does not apply here and is gated off by
# config_set in create_callbacks, so it needs no block.
#
# Ceilings measured on mini (raw LOD2 vs its own 128-bin round trip), which is
# the best any model can score: chamfer 0.155 m, footprint IoU 0.992,
# volumetric IoU 0.991 (defined for 75% -- the rest are not watertight at source).
mesh_eval:
  enabled: true
  every_n_epochs: 10     # generate() is ~1800 sequential forwards, no KV cache
  n_val: 8
  n_test: 32
  batch_size: 8
  n_points: 4096
  taus: [0.25, 0.5]
  voxel_m: 0.25
  save_samples: 8

resume_from: null
