# V6 stage A: gated cross-attention from the frozen v5 (random split, epoch 20)
# into a frozen DINOv3 encoding of the building's orthophoto crop.
# Usage: python main.py --train --config configs/mesh-v6-ortho-xattn-a.yaml
# Runbook: docs/ortho-conditioning-runbook.md
#
# Only the image path trains. The gates start at zero (Flamingo,
# arXiv:2204.14198), so step 0 of this run IS v5 epoch 20. Its
# val_gen_chamfer_m was 0.0859 on exactly the 32 val buildings
# MeshEvalCallback scores here: same seed, split and n_val, and eval_indices
# depends only on len(val). That holds while split.json shows
# skipped_no_image = 0. So epoch-0 `val_gen_chamfer_m` well above 0.0859 means
# the image path is hurting, and any gain below it is the image's.
#
# Gate to stage B (docs/research/2026-10-14-orthophoto-conditioning.md 4.3),
# move on only when all hold:
#   1. Stage A has plateaued: early stopping fired.
#   2. The gates opened: |tanh(alpha_i)| (`train_gate_*`) is clearly non-zero
#      in at least some layers. If every gate stays near zero, unfreezing OPT
#      will not fix it; look upstream at crop alignment, lean and the encoder.
#   3. The shuffled-image gap is real: post-hoc chamfer with another building's
#      image is worse than with the right one by more than the measured
#      per-object metric noise (docs/posthoc-eval-runbook.md).
#
# Everything not commented as changed is v5's, comments included.

mode: train
config_set: mesh
seed: 42

mesh_data:
  dataset_dir: data/The Hague/cleaner
  lod_in: LOD1
  lod_out: LOD2
  num_bins: 128
  margin_lo: [0.0, 0.0, 0.0]
  margin_hi: [0.0, 0.0, 0.1]
  # Unchanged from v3 so the corpus filter is the same one; on mini_cleaner 200
  # kept 97.8% of pairs.
  max_faces: 200
  max_files: null
  tokenization: coord
  # LOWER than v3's 10, on purpose. `MeshDataset` holds every parsed mesh in
  # RAM (~1.5-2 GB for 258,923 pairs), and on Windows each dataloader worker is
  # a spawned process that receives its own pickled copy. At 10 workers that is
  # 15-20 GB of duplicated dataset before a single batch exists. Raise it only
  # after watching resident memory on a short run.
  num_workers: 4
  persistent_workers: true
  # Orthophoto crops in the mesh frame (`MeshDataset(ortho_dir=...)`), relative
  # to dataset_dir. Buildings without full coverage are dropped AFTER the split
  # (Task 2), so every kept building stays in its baseline split.
  ortho_dir: ortho
  image_size: 256
  image_margin: 0.1
  image_min_coverage: 1.0

mesh_model:
  backbone: opt
  opt_name: facebook/opt-125m
  # Architecture-only, as the released MeshAnything inference does
  # (`from_config`, random weights). d_model / n_head / num_layers / max_seq_len
  # are read from the OPT config on this path and ignored here.
  opt_pretrained: false
  dropout: 0.1
  pos_embed: sinusoidal
  n_max_triangles: null
  cond_max_triangles: null
  max_seq_len: null
  tokenizer: coord
  vqvae_ckpt: null
  mask_invalid: true
  # DINOv3 ViT-L/16, web weights (gated: `huggingface-cli login` and accept the
  # licence first). The sat493m variant is the planned ablation.
  image_encoder: facebook/dinov3-vitl16-pretrain-lvd1689m
  image_fusion: xattn
  image_dropout: 0.1
  # Flamingo's GATED XATTN-DENSE (arXiv:2204.14198): a zero-gated FFN after
  # each cross-attention (added 2026-11-05). With OPT frozen in stage A it is
  # the only nonlinear, per-token transform between the attended image
  # features and OPT. Both gates start at 0, so step 0 is still v5.
  # ~4.7M params per layer on opt-125m. Ablate: mesh_model.image_xattn_ffn=false
  image_xattn_ffn: true
  # Stage A: OPT frozen, only the image path (projector, coordinate embedding,
  # null token, cross-attention, gates) trains.
  train_scope: image_only
  backbone_lr_scale: 1.0
  # The original v5 (random split), best checkpoint, as the prefix arms use.
  # It predates the `data_split` hparam, which load_weights_from reads as
  # `random`. On the planned tile split this becomes the v5-tile best instead.
  init_from: outputs/initial-runs/mesh-v5-full-opt-coord/checkpoints/epoch=20-val_gen_chamfer_m=0.0859.ckpt

training:
  batch_size: 4
  accumulate_grad_batches: 4   # effective batch 16, matching v3
  train_val_test_split: [0.8, 0.1, 0.1]
  # v5's per-building random split, FOR NOW (as the prefix arms, 2026-10-24,
  # time constraints): it lets stage A start from the existing v5 checkpoint
  # instead of waiting for the multi-day v5-tile retrain. Same seed and ratios
  # as v5, and `random` reproduces v5's split index-for-index, so v5's
  # val/test stay unseen. The cost is spatial leakage: val/test buildings have
  # training neighbours a median ~6 m away, and those neighbours' crops show
  # val/test roofs, so absolute metrics are optimistic. The true-vs-shuffled
  # gap is still a within-model comparison. The planned split is `tile` +
  # `split_buffer_m: 50.0`, with init_from the v5-tile run.
  split: random
  # New parameters only; Flamingo-scale, not v5's from-scratch 1e-3.
  lr: 1.0e-4
  # Applied to WEIGHT MATRICES ONLY -- embeddings, LayerNorm gains and biases
  # go in a second, undecayed param group (99.4% of the scratch model and 99.6%
  # of the OPT one is decayed). 0.01 is AdamW's own default, so this value is
  # what every run so far actually used; what changes is that the 0.6% that
  # should never have been decayed no longer is.
  #
  # Worth being explicit about here rather than inheriting: decoupled decay is
  # applied every step independently of the gradient, so its strength scales
  # with lr x steps. At the v3 arms' flat 5e-5 over 94k steps it was a 5% pull;
  # at 1e-3 with cosine over 30 epochs of this corpus it is ~7x.
  weight_decay: 0.01
  # Step interval, as in v5.
  warmup_steps: 1000
  # Cosine from the peak down to eta_min = 0.01 * lr, with T_max taken from
  # Lightning's `estimated_stepping_batches`. That means MAX_EPOCHS SETS THE
  # ANNEALING HORIZON: it is the real budget, not a safety ceiling, and
  # shortening it makes the schedule steeper rather than just stopping earlier.
  lr_scheduler: cosine
  lr_decay_steps: 50           # step-schedule knobs, unused under cosine
  lr_decay_rate: 0.5
  # ~65k optimizer steps on cleaner; the gates show within an epoch. Under
  # cosine this is also the annealing horizon.
  max_epochs: 5
  gradient_clip_val: 1.0
  # val_gen_chamfer_m: surface error in metres of a FREE-RUNNING generation,
  # scored against the ground truth through the same tokenizer. Lower is better,
  # so mode: min.
  #
  # NOT val_token_acc, which the v3 runs showed ranks tokenizations in the
  # opposite order to geometry. NOT val_tf_chamfer_m either: that one is
  # teacher-forced, so it measures the metric size of a typical token error
  # rather than what the model produces on its own.
  #
  # This metric only exists on epochs where MeshEvalCallback runs, and
  # `EarlyStopping` is built with Lightning's default strict=True -- a missing
  # monitor raises rather than being skipped. Hence mesh_eval.every_n_epochs: 1
  # below. The two settings are coupled; changing one without the other kills
  # the run on its first validation epoch.
  early_stopping:
    enabled: true
    monitor: val_gen_chamfer_m
    patience: 2
    mode: min
  checkpoint:
    enabled: true
    monitor: val_gen_chamfer_m
    mode: min
    save_top_k: 3
    filename: "{epoch:02d}-{val_gen_chamfer_m:.4f}"

trainer:
  accelerator: auto
  devices: 1
  precision: "32"
  log_every_n_steps: 50

logging:
  loggers:
    - wandb
  project_name: lod-generation
  experiment_name: initial-runs
  run_name: mesh-v6-ortho-xattn-a-random
  save_dir: outputs
  wandb_entity: maxim-lod
  wandb_offline: false
  log_model: false

mesh_eval:
  enabled: true
  # EVERY epoch, because early stopping and checkpointing read this callback's
  # `val_gen_chamfer_m`. At ~13k optimizer steps per epoch the cost of 32
  # beam-5 generations is negligible against the epoch itself.
  every_n_epochs: 1
  # 32, not v3's 8. This is now the selection metric, and a mean over 8
  # buildings is noisy enough that early stopping would fire on the sample
  # rather than on the model.
  n_val: 32
  n_test: 64
  batch_size: 8
  n_points: 4096
  taus: [0.25, 0.5]
  voxel_m: 0.25
  save_samples: 8
  beam_size: 5
  length_penalty: 1.0

resume_from: null
