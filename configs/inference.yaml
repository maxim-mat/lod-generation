# Inference Configuration for CityJSON LOD Generation
# Usage: python main.py --config configs/inference.yaml

mode: inference
seed: 42

# Data settings (used to verify splits/sizes if necessary)
data:
  dataset_dir: data/The Hague
  lods:
    - 1
    - 2
  normalize_coords: false
  num_workers: 4
  n_max: null
  upper_limit_nodes: null

# Model settings
model:
  num_node_classes: 5
  num_edge_classes: 3
  hidden_dim: 64
  edge_dim: 32
  global_dim: 32
  n_head: 8
  num_layers: 4
  dropout: 0.1
  T: 500
  discrete_noise_type: marginal
  nu_pos: 2.5
  nu_x: 1.0
  nu_e: 1.5
  lambda_pos: 3.0
  lambda_x: 0.4
  lambda_e: 2.0

# Trainer settings (required to set up accelerator etc.)
trainer:
  accelerator: auto
  devices: 1

# Inference settings
inference:
  checkpoint_path: null
  batch_size: 10
  output_dir: outputs/generated
